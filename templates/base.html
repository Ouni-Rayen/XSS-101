<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Search{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='logo.jpg') }}" type="image/jpeg">
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="/" class="brand">
                <img src="{{ url_for('static', filename='logo.jpg') }}" alt="" class="logo">
                <span class="brand-name">Securinets <span>ISI</span></span>
            </a>
            <span class="tag">Web &middot; Beginner</span>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 Securinets <span>ISI</span> &middot; CTF Challenge</p>
    </footer>
</body>
</html>
